services:
  - type: web
    name: book-chapter-editor
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 340
    envVars:
      - key: GUNICORN_TIMEOUT
        value: 600
    disks:
      - name: book-editor-data
        mountPath: /opt/render/project/src
        sizeGB: 1
