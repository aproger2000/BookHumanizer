<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Editor v3.1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f4fa;
            color: #1a2634;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 24px;
            border-bottom: 1px solid #d0d9e4;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a2634;
            letter-spacing: -0.3px;
        }
        .logo .sub {
            font-size: 13px;
            color: #6b7f94;
            font-weight: 400;
        }
        .version-badge {
            background: #e4eaf2;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #3d546a;
            font-weight: 500;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 24px;
            margin-top: 28px;
            flex: 1;
        }
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            body { padding: 16px; }
        }
        .panel {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #d0d9e4;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .panel-header h2 {
            font-size: 15px;
            font-weight: 500;
            color: #2c3e50;
            letter-spacing: 0.3px;
        }
        .panel-header .count {
            font-size: 12px;
            color: #6b7f94;
            background: #eef3f8;
            padding: 4px 12px;
            border-radius: 12px;
        }
        textarea {
            width: 100%;
            flex: 1;
            min-height: 400px;
            background: #f7fafc;
            border: 1px solid #d0d9e4;
            border-radius: 12px;
            color: #1a2634;
            font-family: 'Inter', monospace;
            font-size: 14px;
            line-height: 1.7;
            padding: 16px;
            resize: vertical;
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #6c8fc7;
        }
        textarea::placeholder {
            color: #8fa2b8;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e4eaf2;
        }
        .controls select {
            background: #f7fafc;
            border: 1px solid #d0d9e4;
            border-radius: 10px;
            padding: 10px 16px;
            color: #1a2634;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            min-width: 120px;
        }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn-primary {
            background: #2c3e50;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #1a2a3a;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.2);
        }
        .btn-secondary {
            background: #e4eaf2;
            color: #2c3e50;
        }
        .btn-secondary:hover {
            background: #d0d9e4;
        }
        .progress-container {
            margin-top: 12px;
            background: #eef3f8;
            border-radius: 8px;
            height: 6px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .progress-container.active { opacity: 1; }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #2c3e50;
            border-radius: 8px;
            transition: width 0.2s ease;
        }
        .status-text {
            font-size: 13px;
            color: #6b7f94;
            margin-top: 10px;
            min-height: 20px;
        }
        .status-text.success { color: #1e7e34; }
        .status-text.error { color: #b3362a; }
        .copy-btn {
            background: #eef3f8;
            border: 1px solid #d0d9e4;
            color: #2c3e50;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: #d0d9e4; }
        .step-indicator {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            font-size: 12px;
            color: #6b7f94;
            align-items: center;
            flex-wrap: wrap;
        }
        .step-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d0d9e4;
            transition: all 0.3s;
        }
        .step-dot.active { background: #2c3e50; transform: scale(1.2); }
        .step-dot.done { background: #1e7e34; }
        .step-label { font-size: 12px; color: #6b7f94; margin-left: 4px; }
        .footer {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #d0d9e4;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8fa2b8;
            flex-wrap: wrap;
            gap: 8px;
        }
        .footer a { color: #6b7f94; text-decoration: none; }
        .footer a:hover { color: #2c3e50; }
        .result-panel .panel-body { flex: 1; display: flex; flex-direction: column; }
        .result-panel .panel-body textarea { flex: 1; min-height: 400px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">
            <h1>Chapter Editor <span class="sub">— текст как живой</span></h1>
        </div>
        <span class="version-badge">v3.1.0</span>
    </header>

    <div class="main-grid">
        <div class="panel">
            <div class="panel-header">
                <h2>📄 Исходный текст</h2>
                <span class="count" id="sourceCount">0 симв.</span>
            </div>
            <textarea id="sourceText" placeholder="Вставьте главу сюда или загрузите файл..."></textarea>
            <div class="controls">
                <select id="styleSelect">
                    <option value="neutral">Нейтральный</option>
                    <option value="dynamic_scifi" selected>Динамичная НФ</option>
                </select>
                <button class="btn btn-secondary" id="loadBtn">📂 Загрузить</button>
                <button class="btn btn-primary" id="editBtn">✏️ Редактировать</button>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="step-indicator" id="stepIndicator">
                <span>Шаги:</span>
                <span class="step-dot" id="step1"></span>
                <span class="step-label" id="step1Label">Отправка</span>
                <span class="step-dot" id="step2"></span>
                <span class="step-label" id="step2Label">Генерация</span>
                <span class="step-dot" id="step3"></span>
                <span class="step-label" id="step3Label">Пост-обработка</span>
                <span class="step-dot" id="step4"></span>
                <span class="step-label" id="step4Label">Готово</span>
            </div>
            <div class="status-text" id="statusText">Готов к работе</div>
            <input type="file" id="fileInput" accept=".txt,.md,.docx" style="display:none">
        </div>

        <div class="panel result-panel">
            <div class="panel-header">
                <h2>✨ Отредактированный текст</h2>
                <div style="display:flex; gap:8px; align-items:center;">
                    <span class="count" id="resultCount">0 симв.</span>
                    <button class="copy-btn" id="copyBtn">📋 Копировать</button>
                </div>
            </div>
            <div class="panel-body">
                <textarea id="resultText" placeholder="Результат появится здесь..." readonly></textarea>
            </div>
        </div>
    </div>

    <div class="footer">
        <span>Chapter Editor v3.1.0 — обработка через цепочку переводов Google Translate</span>
        <span><a href="#" onclick="location.reload()">Перезагрузить</a></span>
    </div>
</div>

<script>
(function() {
    const sourceText = document.getElementById('sourceText');
    const resultText = document.getElementById('resultText');
    const editBtn = document.getElementById('editBtn');
    const loadBtn = document.getElementById('loadBtn');
    const fileInput = document.getElementById('fileInput');
    const styleSelect = document.getElementById('styleSelect');
    const statusText = document.getElementById('statusText');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const sourceCount = document.getElementById('sourceCount');
    const resultCount = document.getElementById('resultCount');
    const copyBtn = document.getElementById('copyBtn');

    sourceText.addEventListener('input', function() {
        sourceCount.textContent = this.value.length + ' симв.';
    });

    loadBtn.addEventListener('click', function() {
        fileInput.click();
    });

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            sourceText.value = ev.target.result;
            sourceCount.textContent = sourceText.value.length + ' симв.';
            statusText.textContent = '✅ Файл загружен: ' + file.name;
            statusText.className = 'status-text success';
        };
        reader.onerror = function() {
            statusText.textContent = '❌ Ошибка чтения файла';
            statusText.className = 'status-text error';
        };
        reader.readAsText(file, 'UTF-8');
    });

    copyBtn.addEventListener('click', function() {
        if (!resultText.value) {
            statusText.textContent = '⚠️ Нет текста для копирования';
            statusText.className = 'status-text error';
            return;
        }
        navigator.clipboard.writeText(resultText.value).then(() => {
            statusText.textContent = '✅ Текст скопирован в буфер обмена';
            statusText.className = 'status-text success';
        }).catch(() => {
            resultText.select();
            document.execCommand('copy');
            statusText.textContent = '✅ Текст скопирован';
            statusText.className = 'status-text success';
        });
    });

    editBtn.addEventListener('click', function() {
        const text = sourceText.value.trim();
        if (!text) {
            statusText.textContent = '⚠️ Вставьте текст или загрузите файл';
            statusText.className = 'status-text error';
            return;
        }

        const style = styleSelect.value;
        editBtn.disabled = true;
        editBtn.textContent = '⏳ Обработка...';
        statusText.textContent = '⏳ Начинаем обработку...';
        statusText.className = 'status-text';
        progressContainer.classList.add('active');
        progressBar.style.width = '0%';
        resultText.value = '';
        resultCount.textContent = '0 симв.';

        const formData = new FormData();
        formData.append('text', text);
        formData.append('style', style);

        fetch('/api/revise', {
            method: 'POST',
            body: formData,
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => {
                    throw new Error(err.detail || 'Ошибка сервера');
                });
            }
            return handleStream(response);
        })
        .then(data => {
            resultText.value = data.revised_text;
            resultCount.textContent = data.revised_text.length + ' симв.';
            statusText.textContent = '✅ Готово! ' + (data.summary || '');
            statusText.className = 'status-text success';
        })
        .catch(err => {
            statusText.textContent = '❌ ' + err.message;
            statusText.className = 'status-text error';
        })
        .finally(() => {
            editBtn.disabled = false;
            editBtn.textContent = '✏️ Редактировать';
            progressContainer.classList.remove('active');
            progressBar.style.width = '0%';
        });
    });

    function handleStream(response) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let resolved = false;

        return new Promise((resolve, reject) => {
            function read() {
                reader.read().then(({ done, value }) => {
                    if (done) {
                        if (!resolved) reject(new Error('Соединение закрыто'));
                        return;
                    }

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const payload = line.slice(6).trim();
                        if (!payload) continue;

                        try {
                            const event = JSON.parse(payload);
                            handleEvent(event, resolve, reject, () => { resolved = true; });
                        } catch (e) {}
                    }

                    read();
                }).catch(reject);
            }

            read();
        });
    }

    function handleEvent(event, resolve, reject, markResolved) {
        switch (event.type) {
            case 'progress':
                const total = event.estimated_total || 10000;
                const pct = Math.min(100, (event.chars / total) * 100);
                progressBar.style.width = pct + '%';
                statusText.textContent = '⏳ Генерация... ' + Math.round(pct) + '%';
                break;
            case 'done':
                markResolved();
                resolve(event);
                break;
            case 'error':
                markResolved();
                reject(new Error(event.detail || 'Ошибка обработки'));
                break;
        }
    }

    fetch('/api/health')
        .then(res => res.json())
        .then(data => {
            statusText.textContent = '✅ Сервер версии ' + data.version + ' готов';
            statusText.className = 'status-text success';
        })
        .catch(() => {
            statusText.textContent = '⚠️ Не удалось подключиться к серверу';
            statusText.className = 'status-text error';
        });
})();
</script>
</body>
</html>
