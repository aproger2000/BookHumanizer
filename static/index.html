<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f4fa;
            color: #1a2634;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 24px;
            border-bottom: 1px solid #d0d9e4;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a2634;
            letter-spacing: -0.3px;
        }

        .logo .sub {
            font-size: 13px;
            color: #6b7f94;
            font-weight: 400;
        }

        .version-badge {
            background: #e4eaf2;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #3d546a;
            font-weight: 500;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 24px;
            margin-top: 28px;
            flex: 1;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            body { padding: 16px; }
        }

        .panel {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #d0d9e4;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-header h2 {
            font-size: 15px;
            font-weight: 500;
            color: #2c3e50;
            letter-spacing: 0.3px;
        }

        .panel-header .count {
            font-size: 12px;
            color: #6b7f94;
            background: #eef3f8;
            padding: 4px 12px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 400px;
            background: #f7fafc;
            border: 1px solid #d0d9e4;
            border-radius: 12px;
            color: #1a2634;
            font-family: 'Inter', monospace;
            font-size: 14px;
            line-height: 1.7;
            padding: 16px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #6c8fc7;
        }

        textarea::placeholder {
            color: #8fa2b8;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e4eaf2;
        }

        .controls select {
            background: #f7fafc;
            border: 1px solid #d0d9e4;
            border-radius: 10px;
            padding: 10px 16px;
            color: #1a2634;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            min-width: 120px;
        }

        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: #2c3e50;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #1a2a3a;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.2);
        }

        .btn-primary:disabled {
            background: #8fa2b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #e4eaf2;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #d0d9e4;
        }

        .progress-container {
            margin-top: 12px;
            background: #eef3f8;
            border-radius: 8px;
            height: 6px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .progress-container.active {
            opacity: 1;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #2c3e50;
            border-radius: 8px;
            transition: width 0.2s ease;
        }

        .status-text {
            font-size: 13px;
            color: #6b7f94;
            margin-top: 10px;
            min-height: 20px;
        }

        .status-text.success {
            color: #1e7e34;
        }

        .status-text.error {
            color: #b3362a;
        }

        .step-indicator {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            font-size: 12px;
            color: #6b7f94;
            align-items: center;
            flex-wrap: wrap;
        }

        .step-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d0d9e4;
            transition: all 0.3s;
        }

        .step-dot.active {
            background: #2c3e50;
            transform: scale(1.2);
        }

        .step-dot.done {
            background: #1e7e34;
        }

        .step-label {
            font-size: 12px;
            color: #6b7f94;
            margin-left: 4px;
        }

        .result-panel .panel-body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .result-panel .panel-body textarea {
            flex: 1;
            min-height: 400px;
        }

        .checklist {
            margin-top: 12px;
            padding: 12px 16px;
            background: #f7fafc;
            border-radius: 10px;
            border: 1px solid #d0d9e4;
            display: none;
        }

        .checklist.visible {
            display: block;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            font-size: 13px;
            color: #2c3e50;
        }

        .checklist-item .icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .checklist-item .icon.pass {
            color: #1e7e34;
        }

        .checklist-item .icon.fail {
            color: #b3362a;
        }

        .checklist-item .icon.unknown {
            color: #8fa2b8;
        }

        .footer {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #d0d9e4;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8fa2b8;
            flex-wrap: wrap;
            gap: 8px;
        }

        .footer a {
            color: #6b7f94;
            text-decoration: none;
        }

        .footer a:hover {
            color: #2c3e50;
        }

        .copy-btn {
            background: #eef3f8;
            border: 1px solid #d0d9e4;
            color: #2c3e50;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #d0d9e4;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">
            <h1>Chapter Editor <span class="sub">— текст как живой</span></h1>
        </div>
        <span class="version-badge" id="versionBadge">v...</span>
    </header>

    <div class="main-grid">
        <!-- Левая панель -->
        <div class="panel">
            <div class="panel-header">
                <h2>📄 Исходный текст</h2>
                <span class="count" id="sourceCount">0 симв.</span>
            </div>
            <textarea id="sourceText" placeholder="Вставьте главу сюда или загрузите файл..."></textarea>
            <div class="controls">
                <select id="styleSelect">
                    <option value="neutral">Нейтральный</option>
                    <option value="dynamic_scifi" selected>Динамичная НФ</option>
                </select>
                <button class="btn btn-secondary" id="loadBtn">📂 Загрузить</button>
                <button class="btn btn-primary" id="editBtn">✏️ Редактировать</button>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="step-indicator" id="stepIndicator">
                <span>Шаги:</span>
                <span class="step-dot" id="step1"></span>
                <span class="step-label" id="step1Label">Отправка</span>
                <span class="step-dot" id="step2"></span>
                <span class="step-label" id="step2Label">Генерация</span>
                <span class="step-dot" id="step3"></span>
                <span class="step-label" id="step3Label">Пост-обработка</span>
                <span class="step-dot" id="step4"></span>
                <span class="step-label" id="step4Label">Готово</span>
            </div>
            <div class="status-text" id="statusText">Готов к работе</div>
            <input type="file" id="fileInput" accept=".txt,.md,.docx" style="display:none">
        </div>

        <!-- Правая панель -->
        <div class="panel result-panel">
            <div class="panel-header">
                <h2>✨ Отредактированный текст</h2>
                <div style="display:flex; gap:8px; align-items:center;">
                    <span class="count" id="resultCount">0 симв.</span>
                    <button class="copy-btn" id="copyBtn">📋 Копировать</button>
                </div>
            </div>
            <div class="panel-body">
                <textarea id="resultText" placeholder="Результат появится здесь..." readonly></textarea>
            </div>
            <div class="checklist" id="checklist">
                <div id="checklistItems"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <span id="footerVersion">Chapter Editor — обработка через цепочку переводов</span>
        <span><a href="#" onclick="location.reload()">Перезагрузить</a></span>
    </div>
</div>

<script>
(function() {
    const sourceText = document.getElementById('sourceText');
    const resultText = document.getElementById('resultText');
    const editBtn = document.getElementById('editBtn');
    const loadBtn = document.getElementById('loadBtn');
    const fileInput = document.getElementById('fileInput');
    const styleSelect = document.getElementById('styleSelect');
    const statusText = document.getElementById('statusText');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const sourceCount = document.getElementById('sourceCount');
    const resultCount = document.getElementById('resultCount');
    const checklistDiv = document.getElementById('checklist');
    const checklistItems = document.getElementById('checklistItems');
    const copyBtn = document.getElementById('copyBtn');

    // --- ИНТЕЛЛЕКТУАЛЬНОЕ РАЗБИЕНИЕ НА АБЗАЦЫ ---
    function smartSplitIntoParagraphs(text) {
        if (!text || text.length < 150) return text;

        // Если уже есть хорошие абзацы, оставляем
        const existing = text.split('\n\n');
        if (existing.length >= 3) {
            const good = existing.filter(p => p.trim().length > 50);
            if (good.length >= 2) return text;
        }

        // 1. Сначала разбиваем по диалогам (—, «, »)
        let parts = [];
        let currentPart = '';
        let inDialog = false;

        const lines = text.split('\n');
        for (const line of lines) {
            const trimmed = line.trim();
            const isDialog = trimmed.startsWith('—') || trimmed.startsWith('«') || trimmed.startsWith('"');
            
            if (isDialog && !inDialog) {
                if (currentPart) {
                    parts.push(currentPart);
                    currentPart = '';
                }
                inDialog = true;
                currentPart = line;
            } else if (isDialog && inDialog) {
                currentPart += '\n' + line;
            } else if (!isDialog && inDialog) {
                inDialog = false;
                if (currentPart) {
                    parts.push(currentPart);
                    currentPart = '';
                }
                currentPart = line;
            } else {
                currentPart += (currentPart ? '\n' : '') + line;
            }
        }
        if (currentPart) parts.push(currentPart);

        // Если диалогов мало, разбиваем по предложениям
        if (parts.length < 2) {
            const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
            
            const newParts = [];
            let group = [];
            let groupLen = 0;
            const targetLen = 300;

            for (const sent of sentences) {
                const sentLen = sent.length;
                if (sentLen > 200 && group.length > 0) {
                    newParts.push(group.join(' '));
                    group = [];
                    groupLen = 0;
                    newParts.push(sent);
                    continue;
                }
                if (groupLen > targetLen && group.length >= 2) {
                    newParts.push(group.join(' '));
                    group = [];
                    groupLen = 0;
                }
                group.push(sent);
                groupLen += sentLen;
            }
            if (group.length > 0) {
                newParts.push(group.join(' '));
            }
            parts = newParts;
        }

        // Если всё ещё один абзац — разбиваем по длине с умом
        if (parts.length === 1 && text.length > 400) {
            const splitMarkers = ['Алексей', 'Масарик', 'Анна', 'Кросс', 'Он', 'Она', 'Но', 'И', 'Тогда', 'После'];
            let bestSplit = -1;
            let bestScore = -1;

            for (let i = 200; i < text.length - 200; i++) {
                if (text[i] === ' ' || text[i] === '.' || text[i] === '!' || text[i] === '?') {
                    let score = 0;
                    for (const marker of splitMarkers) {
                        if (text.indexOf(marker, i) < i + 50 && text.indexOf(marker, i) > i) {
                            score += 10;
                            break;
                        }
                    }
                    if (text[i] === '.' || text[i] === '!' || text[i] === '?') {
                        score += 5;
                    }
                    if (score > bestScore) {
                        bestScore = score;
                        bestSplit = i + 1;
                    }
                }
            }

            if (bestSplit > 0 && bestSplit < text.length - 50) {
                parts = [
                    text.slice(0, bestSplit).trim(),
                    text.slice(bestSplit).trim()
                ];
            } else {
                const mid = Math.floor(text.length / 2);
                let splitPos = mid;
                while (splitPos > 0 && text[splitPos] !== ' ') {
                    splitPos--;
                }
                if (splitPos > 0) {
                    parts = [
                        text.slice(0, splitPos).trim(),
                        text.slice(splitPos).trim()
                    ];
                }
            }
        }

        return parts.join('\n\n');
    }

    // Шаги
    const stepDots = {
        step1: document.getElementById('step1'),
        step2: document.getElementById('step2'),
        step3: document.getElementById('step3'),
        step4: document.getElementById('step4')
    };

    function resetSteps() {
        Object.values(stepDots).forEach(s => {
            s.className = 'step-dot';
        });
    }

    function setStep(step, label) {
        resetSteps();
        const names = ['step1', 'step2', 'step3', 'step4'];
        for (let i = 0; i <
