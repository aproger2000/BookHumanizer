<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Editor v2.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0d10;
            color: #e8edf2;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 32px;
            border-bottom: 1px solid #1f2429;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo h1 {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, #8ab4f8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }
        .logo .sub {
            font-size: 13px;
            color: #6b7a8f;
            font-weight: 400;
            -webkit-text-fill-color: #6b7a8f;
            background: none;
        }
        .version-badge {
            background: #1a2026;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #8b9bb0;
            border: 1px solid #2a323a;
            font-weight: 500;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 28px;
            flex: 1;
        }
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            body { padding: 16px; }
        }
        .panel {
            background: #12161b;
            border-radius: 16px;
            border: 1px solid #1f2429;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .panel-header h2 {
            font-size: 15px;
            font-weight: 500;
            color: #bcc9d9;
            letter-spacing: 0.3px;
        }
        .panel-header .count {
            font-size: 12px;
            color: #6b7a8f;
            background: #1a2026;
            padding: 4px 12px;
            border-radius: 12px;
        }
        textarea {
            width: 100%;
            flex: 1;
            min-height: 300px;
            background: #0d1115;
            border: 1px solid #1f2429;
            border-radius: 12px;
            color: #d4dce6;
            font-family: 'Inter', monospace;
            font-size: 14px;
            line-height: 1.7;
            padding: 16px;
            resize: vertical;
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #8ab4f8;
        }
        textarea::placeholder {
            color: #3d4855;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #1a2026;
        }
        .controls select {
            background: #0d1115;
            border: 1px solid #1f2429;
            border-radius: 10px;
            padding: 10px 16px;
            color: #d4dce6;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            min-width: 120px;
        }
        .controls select:focus {
            outline: none;
            border-color: #8ab4f8;
        }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8ab4f8, #7c6df0);
            color: #0b0d10;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(138, 180, 248, 0.25);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #1f2429;
            color: #bcc9d9;
        }
        .btn-secondary:hover {
            background: #2a323a;
        }
        .progress-container {
            margin-top: 12px;
            background: #0d1115;
            border-radius: 8px;
            height: 4px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .progress-container.active {
            opacity: 1;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8ab4f8, #c084fc);
            border-radius: 8px;
            transition: width 0.3s ease;
        }
        .status-text {
            font-size: 13px;
            color: #6b7a8f;
            margin-top: 10px;
            min-height: 20px;
        }
        .status-text.success { color: #6fcf97; }
        .status-text.error { color: #f28b82; }
        .checklist {
            margin-top: 12px;
            padding: 12px 16px;
            background: #0d1115;
            border-radius: 10px;
            border: 1px solid #1a2026;
            display: none;
        }
        .checklist.visible { display: block; }
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            font-size: 13px;
            color: #bcc9d9;
        }
        .checklist-item .icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        .checklist-item .icon.pass { color: #6fcf97; }
        .checklist-item .icon.fail { color: #f28b82; }
        .checklist-item .icon.unknown { color: #6b7a8f; }
        .footer {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #1a2026;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #3d4855;
            flex-wrap: wrap;
            gap: 8px;
        }
        .footer a {
            color: #6b7a8f;
            text-decoration: none;
        }
        .footer a:hover { color: #8ab4f8; }
        .copy-btn {
            background: none;
            border: 1px solid #2a323a;
            color: #8b9bb0;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: #1f2429;
            color: #d4dce6;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">
            <h1>Chapter Editor <span class="sub">— текст как живой</span></h1>
        </div>
        <span class="version-badge">v2.2.0</span>
    </header>

    <div class="main-grid">
        <!-- Левая панель: исходный текст -->
        <div class="panel">
            <div class="panel-header">
                <h2>📄 Исходный текст</h2>
                <span class="count" id="sourceCount">0 симв.</span>
            </div>
            <textarea id="sourceText" placeholder="Вставьте главу сюда или загрузите файл..."></textarea>
            <div class="controls">
                <select id="styleSelect">
                    <option value="neutral">Нейтральный</option>
                    <option value="dynamic_scifi" selected>Динамичная НФ</option>
                </select>
                <button class="btn btn-secondary" id="loadBtn">📂 Загрузить</button>
                <button class="btn btn-primary" id="editBtn">✏️ Редактировать</button>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="status-text" id="statusText">Готов к работе</div>
            <input type="file" id="fileInput" accept=".txt,.md,.docx" style="display:none">
        </div>

        <!-- Правая панель: результат -->
        <div class="panel result-panel">
            <div class="panel-header">
                <h2>✨ Отредактированный текст</h2>
                <div style="display:flex; gap:8px; align-items:center;">
                    <span class="count" id="resultCount">0 симв.</span>
                    <button class="copy-btn" id="copyBtn">📋 Копировать</button>
                </div>
            </div>
            <div class="panel-body">
                <textarea id="resultText" placeholder="Результат появится здесь..." readonly></textarea>
            </div>
            <!-- Чек-лист -->
            <div class="checklist" id="checklist">
                <div id="checklistItems"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <span>Chapter Editor v2.2.0 — обработка через Claude</span>
        <span><a href="https://github.com" target="_blank">GitHub</a> · <a href="#" onclick="location.reload()">Перезагрузить</a></span>
    </div>
</div>

<script>
(function() {
    const sourceText = document.getElementById('sourceText');
    const resultText = document.getElementById('resultText');
    const editBtn = document.getElementById('editBtn');
    const loadBtn = document.getElementById('loadBtn');
    const fileInput = document.getElementById('fileInput');
    const styleSelect = document.getElementById('styleSelect');
    const statusText = document.getElementById('statusText');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const sourceCount = document.getElementById('sourceCount');
    const resultCount = document.getElementById('resultCount');
    const checklistDiv = document.getElementById('checklist');
    const checklistItems = document.getElementById('checklistItems');
    const copyBtn = document.getElementById('copyBtn');

    // Подсчёт символов в исходнике
    sourceText.addEventListener('input', function() {
        sourceCount.textContent = this.value.length + ' симв.';
    });

    // Кнопка "Загрузить"
    loadBtn.addEventListener('click', function() {
        fileInput.click();
    });

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(ev) {
            sourceText.value = ev.target.result;
            sourceCount.textContent = sourceText.value.length + ' симв.';
            statusText.textContent = '✅ Файл загружен: ' + file.name;
            statusText.className = 'status-text success';
        };
        reader.onerror = function() {
            statusText.textContent = '❌ Ошибка чтения файла';
            statusText.className = 'status-text error';
        };
        reader.readAsText(file, 'UTF-8');
    });

    // Кнопка "Копировать"
    copyBtn.addEventListener('click', function() {
        if (!resultText.value) {
            statusText.textContent = '⚠️ Нет текста для копирования';
            statusText.className = 'status-text error';
            return;
        }
        navigator.clipboard.writeText(resultText.value).then(() => {
            statusText.textContent = '✅ Текст скопирован в буфер обмена';
            statusText.className = 'status-text success';
            setTimeout(() => {
                if (!resultText.value) return;
                statusText.textContent = '✅ Готово!';
            }, 2000);
        }).catch(() => {
            // fallback
            resultText.select();
            document.execCommand('copy');
            statusText.textContent = '✅ Текст скопирован';
            statusText.className = 'status-text success';
        });
    });

    // Кнопка "Редактировать"
    editBtn.addEventListener('click', function() {
        const text = sourceText.value.trim();
        if (!text) {
            statusText.textContent = '⚠️ Вставьте текст или загрузите файл';
            statusText.className = 'status-text error';
            return;
        }

        const style = styleSelect.value;
        editBtn.disabled = true;
        editBtn.textContent = '⏳ Обработка...';
        statusText.textContent = '⏳ Редактирование...';
        statusText.className = 'status-text';
        progressContainer.classList.add('active');
        progressBar.style.width = '0%';
        checklistDiv.classList.remove('visible');
        resultText.value = '';
        resultCount.textContent = '0 симв.';

        const formData = new FormData();
        formData.append('text', text);
        formData.append('style', style);

        fetch('/api/revise', {
            method: 'POST',
            body: formData,
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => {
                    throw new Error(err.detail || 'Ошибка сервера');
                });
            }
            return handleStream(response);
        })
        .then(data => {
            resultText.value = data.revised_text;
            resultCount.textContent = data.revised_text.length + ' симв.';
            statusText.textContent = '✅ Готово! ' + (data.summary || '');
            statusText.className = 'status-text success';

            if (data.checklist && data.checklist.length) {
                renderChecklist(data.checklist);
                checklistDiv.classList.add('visible');
            }
        })
        .catch(err => {
            statusText.textContent = '❌ ' + err.message;
            statusText.className = 'status-text error';
        })
        .finally(() => {
            editBtn.disabled = false;
            editBtn.textContent = '✏️ Редактировать';
            progressContainer.classList.remove('active');
            progressBar.style.width = '0%';
        });
    });

    function handleStream(response) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let resolved = false;

        return new Promise((resolve, reject) => {
            function read() {
                reader.read().then(({ done, value }) => {
                    if (done) {
                        if (!resolved) reject(new Error('Соединение закрыто'));
                        return;
                    }

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const payload = line.slice(6).trim();
                        if (!payload) continue;

                        try {
                            const event = JSON.parse(payload);
                            handleEvent(event, resolve, reject, () => { resolved = true; });
                        } catch (e) {
                            // игнорируем битые JSON
                        }
                    }

                    read();
                }).catch(reject);
            }

            read();
        });
    }

    function handleEvent(event, resolve, reject, markResolved) {
        switch (event.type) {
            case 'progress':
                const total = event.estimated_total || 10000;
                const pct = Math.min(100, (event.chars / total) * 100);
                progressBar.style.width = pct + '%';
                statusText.textContent = '⏳ Генерация... ' + Math.round(pct) + '%';
                break;

            case 'done':
                markResolved();
                resolve(event);
                break;

            case 'error':
                markResolved();
                reject(new Error(event.detail || 'Ошибка обработки'));
                break;

            default:
                break;
        }
    }

    function renderChecklist(checklist) {
        checklistItems.innerHTML = '';
        let passedCount = 0;
        const total = checklist.length;

        checklist.forEach(item => {
            const div = document.createElement('div');
            div.className = 'checklist-item';

            const icon = document.createElement('span');
            icon.className = 'icon';
            if (item.passed === true) {
                icon.textContent = '✅';
                icon.classList.add('pass');
                passedCount++;
            } else if (item.passed === false) {
                icon.textContent = '❌';
                icon.classList.add('fail');
            } else {
                icon.textContent = '⏳';
                icon.classList.add('unknown');
            }

            const label = document.createElement('span');
            label.textContent = item.label;

            if (item.note) {
                const note = document.createElement('span');
                note.style.cssText = 'color: #6b7a8f; font-size: 12px; margin-left: 8px;';
                note.textContent = '— ' + item.note;
                div.appendChild(icon);
                div.appendChild(label);
                div.appendChild(note);
            } else {
                div.appendChild(icon);
                div.appendChild(label);
            }

            checklistItems.appendChild(div);
        });

        const header = document.createElement('div');
        header.style.cssText = 'font-weight: 500; margin-bottom: 8px; color: #bcc9d9; font-size: 13px;';
        header.textContent = `📋 Чек-лист: ${passedCount}/${total} пунктов выполнено`;
        checklistItems.prepend(header);
    }

    // Проверка соединения с сервером при загрузке
    fetch('/api/health')
        .then(res => res.json())
        .then(data => {
            statusText.textContent = '✅ Сервер версии ' + data.version + ' готов';
            statusText.className = 'status-text success';
        })
        .catch(() => {
            statusText.textContent = '⚠️ Не удалось подключиться к серверу';
            statusText.className = 'status-text error';
        });
})();
</script>
</body>
</html>
