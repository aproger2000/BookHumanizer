<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Editor v2.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d10;
            color: #e8edf2;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 32px;
            border-bottom: 1px solid #1f2429;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, #8ab4f8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }

        .logo .sub {
            font-size: 13px;
            color: #6b7a8f;
            font-weight: 400;
            -webkit-text-fill-color: #6b7a8f;
            background: none;
        }

        .version-badge {
            background: #1a2026;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #8b9bb0;
            border: 1px solid #2a323a;
            font-weight: 500;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 28px;
            flex: 1;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            body { padding: 16px; }
        }

        .panel {
            background: #12161b;
            border-radius: 16px;
            border: 1px solid #1f2429;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-header h2 {
            font-size: 15px;
            font-weight: 500;
            color: #bcc9d9;
            letter-spacing: 0.3px;
        }

        .panel-header .count {
            font-size: 12px;
            color: #6b7a8f;
            background: #1a2026;
            padding: 4px 12px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 300px;
            background: #0d1115;
            border: 1px solid #1f2429;
            border-radius: 12px;
            color: #d4dce6;
            font-family: 'Inter', monospace;
            font-size: 14px;
            line-height: 1.7;
            padding: 16px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #8ab4f8;
        }

        textarea::placeholder {
            color: #3d4855;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #1a2026;
        }

        .controls select {
            background: #0d1115;
            border: 1px solid #1f2429;
            border-radius: 10px;
            padding: 10px 16px;
            color: #d4dce6;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            min-width: 120px;
        }

        .controls select:focus {
            outline: none;
            border-color: #8ab4f8;
        }

        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8ab4f8, #7c6df0);
            color: #0b0d10;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(138, 180, 248, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #1f2429;
            color: #bcc9d9;
        }

        .btn-secondary:hover {
            background: #2a323a;
        }

        .progress-container {
            margin-top: 12px;
            background: #0d1115;
            border-radius: 8px;
            height: 4px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .progress-container.active {
            opacity: 1;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8ab4f8, #c084fc);
            border-radius: 8px;
            transition: width 0.3s ease;
        }

        .result-panel .panel-body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .result-panel .panel-body textarea {
            flex: 1;
            min-height: 300px;
        }

        .status-text {
            font-size: 13px;
            color: #6b7a8f;
            margin-top: 10px;
            min-height: 20px;
        }

        .status-text.success {
            color: #6fcf97;
        }

        .status-text.error {
            color: #f28b82;
        }

        .checklist {
            margin-top: 12px;
            padding: 12px 16px;
            background: #0d1115;
            border-radius: 10px;
            border: 1px solid #1a2026;
            display: none;
        }

        .checklist.visible {
            display: block;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            font-size: 13px;
            color: #bcc9d9;
        }

        .checklist-item .icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .checklist-item .icon.pass {
            color: #6fcf97;
        }

        .checklist-item .icon.fail {
            color: #f28b82;
        }

        .checklist-item .icon.unknown {
            color: #6b7a8f;
        }

        .footer {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #1a2026;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #3d4855;
            flex-wrap: wrap;
            gap: 8px;
        }

        .footer a {
            color: #6b7a8f;
            text-decoration: none;
        }

        .footer a:hover {
            color: #8ab4f8;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2429;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #2a323a;
            color: #d4dce6;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">
            <h1>Chapter Editor <span class="sub">— текст как живой</span></h1>
        </div>
        <span class="version-badge">v2.2.0</span>
    </header>

    <div class="main-grid">
        <div class="panel">
            <div class="panel-header">
                <h2>📄 Исходный текст</h2>
                <span class="count" id="sourceCount">0 симв.</span>
            </div>
            <textarea id="sourceText" placeholder="Вставьте главу сюда или загрузите файл..."></textarea>
            <div class="controls">
                <select id="styleSelect">
                    <option value="neutral">Нейтральный</option>
                    <option value="dynamic_scifi" selected>Динамичная НФ</option>
                </select>
                <button class="btn btn-secondary" id="loadBtn">📂 Загрузить</button>
                <button class="btn btn-primary" id="editBtn">✏️ Редактировать</button>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="status-text" id="statusText">Готов к работе</div>
            <input type="file" id="fileInput" accept=".txt,.md,.docx" style="display:none">
        </div>
